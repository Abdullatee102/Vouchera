<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064e3b"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="400" height="220" rx="16"/>
    </clipPath>
  </defs>
  <!-- Card background -->
  <rect width="400" height="220" rx="16" fill="url(#bg)"/>
  <rect width="400" height="220" rx="16" fill="url(#shine)"/>
  <!-- Decorative circles -->
  <circle cx="340" cy="40" r="80" fill="#10b981" fill-opacity="0.08"/>
  <circle cx="60" cy="180" r="60" fill="#10b981" fill-opacity="0.06"/>
  <!-- Perforation line -->
  <line x1="0" y1="145" x2="400" y2="145" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
  <circle cx="0" cy="145" r="12" fill="#0a0f1e"/>
  <circle cx="400" cy="145" r="12" fill="#0a0f1e"/>
  <!-- Vouchera brand -->
  <text x="24" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#10b981" letter-spacing="2">VOUCHERA</text>
  <!-- Category badge -->
  <rect x="318" y="18" width="62" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
  <text x="349" y="33" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">FOOD</text>
  <!-- Food icon -->
  <text x="24" y="95" font-size="40">🍎</text>
  <!-- Program name -->
  <text x="80" y="72" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Food Support</text>
  <text x="80" y="92" font-family="system-ui, sans-serif" font-size="13" fill="#6ee7b7" opacity="0.8">Restricted Subsidy Voucher</text>
  <!-- Amount area -->
  <text x="24" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#6ee7b7" opacity="0.7" letter-spacing="1">ALLOCATED VALUE</text>
  <text x="24" y="108" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">20 BOT</text>
  <!-- Bottom info -->
  <text x="24" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" opacity="0.6">BENEFICIARY</text>
  <text x="24" y="182" font-family="monospace, monospace" font-size="11" fill="#10b981">0xABC...1234</text>
  <text x="240" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" opacity="0.6">EXPIRES</text>
  <text x="240" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#10b981">30 days</text>
  <!-- Restricted badge -->
  <rect x="24" y="196" width="130" height="16" rx="8" fill="#10b981" fill-opacity="0.15"/>
  <text x="89" y="208" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">🔒 RESTRICTED VOUCHER</text>
  <!-- Shield watermark -->
  <text x="340" y="125" font-size="32" opacity="0.06">🛡️</text>
</svg>

